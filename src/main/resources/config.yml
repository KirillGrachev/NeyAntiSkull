# NeyAntiSkull - blocks placing player heads with the configured display names.
#
# PLACEHOLDERS - work in every text of this file:
#
#   List
#     {names}             number of names in the blocked list
#
#   Service (info, reload)
#     {version}           plugin version from plugin.yml
#     {time}              reload time, ms
#     {blocking}          settings.enabled as a state_on / state_off word
#     {list}              settings.list.enabled as a state word
#     {case_sensitive}    settings.list.case_sensitive as a state word
#     {take_away}         settings.take_away.enabled as a state word
#     {take_away_type}    settings.take_away.type (HAND or ALL)
#     {permissions}       permissions.enabled as a state word
#     {prefix}            messages.prefix
#
# HEX colors are supported everywhere: #RRGGBB and &#RRGGBB.

settings:

  enabled: true # Master switch. If false - placement is never blocked

  list:
    enabled: true # If false - EVERY player head is blocked, names are not looked at
    case_sensitive: false # Compare display names with their exact case
    # Display names that cannot be placed. Colors are part of the name, so
    # "&aPlayer Head", "#42fffcPlayer Head" and plain "Player Head" are three
    # different entries - list every variant you want to block.
    names:
      - "&aPlayer Head"
      - "Player Head"
      - "#42fffcPlayer Head"

  take_away:
    enabled: true # Take the head away when its placement is blocked
    # HAND - only the stack from the hand that placed it
    # ALL  - every matching head in the inventory
    type: HAND

permissions:

  enabled: false # Enable the permission system: both bypass nodes below become active

  # Place the blocked heads anyway
  place: "antiskull.bypass.place"
  # Keep the item when a blocked placement is cancelled
  take_away: "antiskull.bypass.takeaway"

messages:

  enabled: true # Master switch for all plugin messages
  prefix: "" # Substituted into {prefix} inside the texts (empty = no prefix)

  # Word-fragments for the state placeholders inside info (not standalone
  # messages): /antiskull info assembles lines like "Blocking: <state_on|state_off>"
  state_on:
    enabled: true
    text: "&aenabled"

  state_off:
    enabled: true
    text: "&cdisabled"

  # Sent to the player whose head placement was blocked
  blocked:
    enabled: true
    text:
      - ""
      - " #efff5e[⚠] #ecff45Attention! Placement of this item is prohibited. "
      - ""

  no_permission:
    enabled: true
    text: "{prefix}&#ff6b6bYou do not have permission to do this."

  usage:
    enabled: true
    text:
      - "{prefix}&#8ce0ffNeyAntiSkull commands:"
      - "&f/antiskull reload &8- &7reload the configuration"
      - "&f/antiskull info &8- &7current blocking rules and the list size"

  reload:
    enabled: true
    text: "{prefix}&#9dff8cConfiguration reloaded &7({time} ms, {names} names in the list)."

  info:
    enabled: true
    text:
      - "{prefix}&7Version: &f{version}"
      - "&7Blocking: &f{blocking}"
      - "&7Name list: &f{list} &8({names} names)"
      - "&7Case sensitive: &f{case_sensitive}"
      - "&7Take away: &f{take_away} &8({take_away_type})"
      - "&7Permissions: &f{permissions}"
